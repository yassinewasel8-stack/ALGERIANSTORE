<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الجزائر الإلكتروني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 0.5rem 1.2rem;
            width: 250px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            width: 100%;
            margin-right: 8px;
        }

        .admin-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .admin-btn:hover {
            background: var(--danger-color);
            color: white;
        }

        .categories-container {
            padding: 1.5rem 2rem 0.5rem 2rem;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            justify-content: flex-start;
            scrollbar-width: thin;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .container {
            max-width: 100%;
            padding: 1.5rem 2rem;
            flex: 1;
        }

        /* عرض المنتجات بشكل أفقـي جنب بعضها */
        .products-grid {
            display: flex;
            flex-direction: row;
            gap: 1.5rem;
            overflow-x: auto;
            padding-bottom: 1.5rem;
            scroll-behavior: smooth;
        }

        .products-grid::-webkit-scrollbar {
            height: 8px;
        }
        .products-grid::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            min-width: 280px;
            max-width: 280px;
            flex-shrink: 0;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #1e293b;
        }

        .product-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .product-category {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: 700;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-rating {
            color: var(--gold);
            font-size: 0.9rem;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--success-color);
        }

        .btn-view {
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent-color);
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 1.5rem;
        }

        .close-btn {
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 35px; height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .modal-header-flex {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .modal-img {
            width: 250px;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }

        .modal-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn-order-now {
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-order-now:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .order-form-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.7rem;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .comments-section {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: 1.5rem;
        }

        .star-rating-input {
            display: flex;
            gap: 5px;
            font-size: 1.5rem;
            color: #475569;
            cursor: pointer;
            margin: 0.5rem 0;
        }

        .star-rating-input .fa-star.active {
            color: var(--gold);
        }

        .comment-form input, .comment-form textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem;
            color: white;
            margin-bottom: 0.5rem;
            outline: none;
        }

        .comment-form button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .comments-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .comment-author {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .order-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .delete-order-btn {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            margin-top: auto;
        }

        .footer-banner {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            color: white;
        }

        .phone-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: #0f172a;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 800;
            text-decoration: none;
            margin-top: 10px;
            transition: 0.3s;
        }

        @media(max-width: 600px) {
            .modal-header-flex { flex-direction: column; }
            .modal-img { width: 100%; }
            .form-row { grid-template-columns: 1fr; }
            header { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-cart-shopping"></i> متجر الجزائر الإلكتروني
        </div>
        <div class="header-actions">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن منتج..." onkeyup="filterProducts()">
            </div>
            <button class="admin-btn" onclick="openAdminPanel()">
                <i class="fa-solid fa-user-gear"></i> أدمن
            </button>
        </div>
    </header>

    <!-- الأقسام الكثيرة (Categories) -->
    <div class="categories-container">
        <button class="cat-btn active" onclick="filterCategory('all', event)"><i class="fa-solid fa-border-all"></i> الكل</button>
        <button class="cat-btn" onclick="filterCategory('electronics', event)"><i class="fa-solid fa-laptop"></i> إلكترونيات</button>
        <button class="cat-btn" onclick="filterCategory('clothing', event)"><i class="fa-solid fa-shirt"></i> ملابس وأزياء</button>
        <button class="cat-btn" onclick="filterCategory('books', event)"><i class="fa-solid fa-book"></i> كتب ومجلات</button>
        <button class="cat-btn" onclick="filterCategory('courses', event)"><i class="fa-solid fa-graduation-cap"></i> كورسات وتدريب</button>
        <button class="cat-btn" onclick="filterCategory('games', event)"><i class="fa-solid fa-gamepad"></i> ألعاب وتسلية</button>
        <button class="cat-btn" onclick="filterCategory('auto', event)"><i class="fa-solid fa-car"></i> سيارات وقطع غيار</button>
        <button class="cat-btn" onclick="filterCategory('movies', event)"><i class="fa-solid fa-film"></i> أفلام وترفيه</button>
    </div>

    <!-- شبكة المنتجات (معروضة بشكل أفقي) -->
    <div class="container">
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- 1. نافذة التفاصيل والطلب -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('productModal')">&times;</button>
            <div class="modal-header-flex">
                <img id="mImage" class="modal-img" src="" alt="صورة المنتج">
                <div class="modal-details">
                    <span id="mCategory" class="product-category"></span>
                    <h2 id="mTitle"></h2>
                    <div id="mRating" class="product-rating"></div>
                    <p id="mDesc" style="color: var(--text-muted); font-size: 0.95rem;"></p>
                    <div class="product-price" id="mPrice"></div>
                    
                    <button class="btn-order-now" onclick="openOrderModal()">
                        <i class="fa-solid fa-bag-shopping"></i> طلب شراء هذا المنتج الان
                    </button>
                </div>
            </div>

            <!-- التعليقات -->
            <div class="comments-section">
                <h3><i class="fa-solid fa-comments"></i> آراء وتقييمات الزوار</h3>
                <div class="comment-form" style="margin-top: 10px;">
                    <label style="font-size: 0.85rem; color: var(--text-muted);">أضف تقييمك بالنجوم:</label>
                    <div class="star-rating-input" id="starInput">
                        <i class="fa-solid fa-star" data-value="1"></i>
                        <i class="fa-solid fa-star" data-value="2"></i>
                        <i class="fa-solid fa-star" data-value="3"></i>
                        <i class="fa-solid fa-star" data-value="4"></i>
                        <i class="fa-solid fa-star" data-value="5"></i>
                    </div>
                    <input type="text" id="commentUser" placeholder="الاسم الكامل">
                    <textarea id="commentText" rows="3" placeholder="اكتب رأيك حول هذا المنتج..."></textarea>
                    <button onclick="submitComment()"><i class="fa-solid fa-paper-plane"></i> نشر التعليق</button>
                </div>

                <div class="comments-list" id="commentsList"></div>
            </div>
        </div>
    </div>

    <!-- 2. نافذة تقديم الطلب -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content" style="max-width: 500px;">
            <button class="close-btn" onclick="closeModal('orderModal')">&times;</button>
            
            <h2 style="margin-bottom: 0.5rem; color: var(--success-color);">
                <i class="fa-solid fa-file-signature"></i> تقديم طلب شراء
            </h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
                المنتج المطلوب: <strong id="orderProductTitle" style="color: white;"></strong>
            </p>

            <form class="order-form-container" onsubmit="handleOrderSubmit(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>الاسم الأول *</label>
                        <input type="text" id="custFirstName" required placeholder="مثال: أحمد">
                    </div>
                    <div class="form-group">
                        <label>اللقب / العائلة *</label>
                        <input type="text" id="custLastName" required placeholder="مثال: يونس">
                    </div>
                </div>

                <div class="form-group">
                    <label>رقم الهاتف *</label>
                    <input type="tel" id="custPhone" required placeholder="07XXXXXXXX">
                </div>

                <div class="form-group">
                    <label>العنوان الكامل / الولاية *</label>
                    <input type="text" id="custAddress" required placeholder="البلدية، الولاية">
                </div>

                <div class="form-group">
                    <label>ملاحظات إضافية (اختياري)</label>
                    <textarea id="custNotes" rows="2" placeholder="أي تفاصيل تود إضافتها للطلب..."></textarea>
                </div>

                <button type="submit" class="btn-order-now" style="width: 100%; margin-top: 5px;">
                    <i class="fa-solid fa-check-circle"></i> تأكيد وإرسال الطلب
                </button>
            </form>
        </div>
    </div>

    <!-- 3. نافذة تأكيد النجاح للزبون -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content" style="max-width: 450px; text-align: center; padding: 2rem;">
            <i class="fa-solid fa-circle-check" style="font-size: 4rem; color: var(--success-color); margin-bottom: 1rem;"></i>
            <h2 style="margin-bottom: 0.5rem;">تم تسجيل طلبك بنجاح!</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;" id="successMessageDetails"></p>
            <button class="cat-btn active" style="margin: 0 auto;" onclick="closeModal('successModal')">العودة للمتجر</button>
        </div>
    </div>

    <!-- 4. نافذة لوحة الأدمن -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-content" style="max-width: 800px;">
            <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                <h2><i class="fa-solid fa-user-shield" style="color: var(--danger-color);"></i> لوحة الأدمن</h2>
                <button class="delete-order-btn" onclick="clearAllOrders()"><i class="fa-solid fa-trash"></i> مسح كافة الطلبات</button>
            </div>

            <div class="orders-list" id="adminOrdersContainer"></div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <div class="footer-banner">
            <h2><i class="fa-solid fa-bullhorn"></i> هل تريد عرض منتجاتك أو خدماتك معنا؟</h2>
            <p style="margin-top: 5px;">عرض ووضع السلع على المتجر حالياً <strong>مجاني بشكل كامل!</strong></p>
            <a href="tel:0783373607" class="phone-link">
                <i class="fa-solid fa-phone"></i> تواصل معي مباشرة: 0783373607
            </a>
        </div>
        <p style="color: var(--text-muted); font-size: 0.85rem;">جميع الحقوق محفوظة &copy; 2026 - متجر الجزائر الإلكتروني</p>
    </footer>

                price: "1800 د.ج",
                rating: 5,
                image: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=500",
                description: "منفذ شحن يدعم الشحن السريع لمختلف الهواتف الذكية في السيارة.",
                comments: []
            },
            {
                id: 7,
                title: "سلسلة وثائقية: تاريخ التقنية",
                category: "movies",
                categoryName: "أفلام وترفيه",
                price: "800 د.ج",
                rating: 4,
                image: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500",
                description: "مجموعة أفلام وثائقية عالية الجودة عن نشأة الكمبيوتر والإنترنت.",
                comments: []
            }
        ];

        let activeProductId = null;
        let selectedStars = 5;

        function displayProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            items.forEach(product => {
                const starsHtml = '★'.repeat(product.rating) + '☆'.repeat(5 - product.rating);
                grid.innerHTML += `
                    <div class="product-card" onclick="openProductModal(${product.id})">
                        <img src="${product.image}" class="product-img" alt="${product.title}">
                        <div class="product-info">
                            <span class="product-category">${product.categoryName}</span>
                            <h3 class="product-title">${product.title}</h3>
                            <div class="product-rating">${starsHtml}</div>
                            <div class="product-bottom">
                                <span class="product-price">${product.price}</span>
                                <button class="btn-view">التفاصيل والطلب</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, evt) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(evt) evt.currentTarget.classList.add('active');

            if(cat === 'all') displayProducts(products);
            else displayProducts(products.filter(p => p.category === cat));
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            displayProducts(products.filter(p => p.title.toLowerCase().includes(query)));
        }

        function openProductModal(id) {
            const product = products.find(p => p.id === id);
            activeProductId = id;

            document.getElementById('mImage').src = product.image;
            document.getElementById('mTitle').innerText = product.title;
            document.getElementById('mCategory').innerText = product.categoryName;
            document.getElementById('mPrice').innerText = product.price;
            document.getElementById('mDesc').innerText = product.description;
            document.getElementById('mRating').innerHTML = '★'.repeat(product.rating) + '☆'.repeat(5 - product.rating);

            renderComments(product.comments);
            document.getElementById('productModal').style.display = 'flex';
        }

        function openOrderModal() {
            const product = products.find(p => p.id === activeProductId);
            document.getElementById('orderProductTitle').innerText = `${product.title} (${product.price})`;
            document.getElementById('productModal').style.display = 'none';
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function handleOrderSubmit(event) {
            event.preventDefault();
            const product = products.find(p => p.id === activeProductId);
            
            const newOrder = {
                id: Math.floor(100000 + Math.random() * 900000),
                productTitle: product.title,
                price: product.price,
                firstName: document.getElementById('custFirstName').value,
                lastName: document.getElementById('custLastName').value,
                phone: document.getElementById('custPhone').value,
                address: document.getElementById('custAddress').value,
                notes: document.getElementById('custNotes').value || 'لا يوجد',
                date: new Date().toLocaleString('ar-EG')
            };

            let existingOrders = JSON.parse(localStorage.getItem('myStoreOrders')) || [];
            existingOrders.push(newOrder);
            localStorage.setItem('myStoreOrders', JSON.stringify(existingOrders));

            document.getElementById('successMessageDetails').innerText = 
                `شكراً لك ${newOrder.firstName} ${newOrder.lastName}. تم تسجيل طلبك (#${newOrder.id}) بنجاح. سنتصل بك قريباً على ${newOrder.phone}.`;
            
            closeModal('orderModal');
            document.getElementById('successModal').style.display = 'flex';
            event.target.reset();
        }

        function openAdminPanel() {
            const pass = prompt("يرجى إدخال كلمة سر الأدمن لرؤية الطلبات:");
            if (pass === ADMIN_PASSWORD) {
                renderAdminOrders();
                document.getElementById('adminModal').style.display = 'flex';
            } else if (pass !== null) {
                alert("كلمة السر خاطئة!");
            }
        }

        function renderAdminOrders() {
            const container = document.getElementById('adminOrdersContainer');
            const orders = JSON.parse(localStorage.getItem('myStoreOrders')) || [];

            if (orders.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem;">لا توجد أي طلبات حالياً.</p>';
                return;
            }

            container.innerHTML = '';
            orders.reverse().forEach((order) => {
                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-card-header">
                            <span>طلب رقم #${order.id} - ${order.date}</span>
                            <button class="delete-order-btn" onclick="deleteSingleOrder(${order.id})"><i class="fa-solid fa-xmark"></i> حذف الطلب</button>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.5rem; font-size: 0.95rem;">
                            <div><strong>المنتج:</strong> ${order.productTitle} (${order.price})</div>
                            <div><strong>الاسم الكامل:</strong> ${order.firstName} ${order.lastName}</div>
                            <div><strong>رقم الهاتف:</strong> <a href="tel:${order.phone}" style="color: var(--success-color);">${order.phone}</a></div>
                            <div><strong>العنوان:</strong> ${order.address}</div>
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 0.3rem;">
                            <strong>الملاحظات:</strong> ${order.notes}
                        </div>
                    </div>
                `;
            });
        }

        function deleteSingleOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem('myStoreOrders')) || [];
            orders = orders.filter(o => o.id !== orderId);
            localStorage.setItem('myStoreOrders', JSON.stringify(orders));
            renderAdminOrders();
        }

        function clearAllOrders() {
            if (confirm("هل أنت تأكد من مسح جميع الطلبات؟")) {
                localStorage.removeItem('myStoreOrders');
                renderAdminOrders();
            }
        }

        const stars = document.querySelectorAll('#starInput i');
        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                selectedStars = parseInt(e.target.getAttribute('data-value'));
                stars.forEach((s, idx) => {
                    if(idx < selectedStars) s.classList.add('active');
                    else s.classList.remove('active');
                });
            });
        });
        stars.forEach(s => s.classList.add('active'));

        function submitComment() {
            const name = document.getElementById('commentUser').value.trim();
            const text = document.getElementById('commentText').value.trim();

            if(!name || !text) {
                alert('يرجى كتابة الاسم والتعليق أولاً!');
                return;
            }

            const product = products.find(p => p.id === activeProductId);
            product.comments.push({ name: name, stars: selectedStars, text: text });

            renderComments(product.comments);
            document.getElementById('commentUser').value = '';
            document.getElementById('commentText').value = '';
        }

        function renderComments(commentsList) {
            const listContainer = document.getElementById('commentsList');
            listContainer.innerHTML = '';
            
            if(commentsList.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">لا توجد تعليقات بعد.</p>';
                return;
            }

            commentsList.forEach(c => {
                listContainer.innerHTML += `
                    <div class="comment-item">
                        <div class="comment-author">
                            <span>${c.name}</span>
                            <span style="color: var(--gold);">${'★'.repeat(c.stars)}</span>
                        </div>
                        <p style="margin-top: 5px; font-size: 0.9rem; color: #cbd5e1;">${c.text}</p>
                    </div>
                `;
            });
        }

        displayProducts(products);
    </script>
</body>
</html>
